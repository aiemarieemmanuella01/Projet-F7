<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#A89078">
    <title>Ma ToDo</title>

    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="lib/framework7-icons/css/framework7-icons.css">

    <link rel="stylesheet" href="css/app.css">
</head>

<body>
<div id="app">
    <div class="view view-main view-init safe-areas">
        <div class="page page-beige">

            <div class="navbar">
                <div class="navbar-bg chic-navbar"></div>
                <div class="navbar-inner">
                    <div class="title chic-title">Ma ToDo</div>
                </div>
            </div>

            <div class="page-content">

                <div class="block">
                    <div class="segmented segmented-raised">
                        <a class="button button-active filtre-btn" data-filtre="toutes">Toutes</a>
                        <a class="button filtre-btn" data-filtre="afaire">À faire</a>
                        <a class="button filtre-btn" data-filtre="faites">Faites</a>
                    </div>
                </div>

                <div class="block-title compteur chic-compteur"></div>

                <div class="list chic-list">
                    <ul class="liste-taches">
                        </ul>
                </div>

                <div class="list chic-list">
                    <ul>
                        <li class="item-content item-input">
                            <div class="item-inner">
                                <div class="item-input-wrap">
                                    <input type="text" id="champ-tache" placeholder="Nouvelle tâche...">
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="block">
                    <a href="#" class="button button-fill button-large chic-btn" id="btn-ajouter">
                        Ajouter
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="lib/framework7-bundle.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
</html>
